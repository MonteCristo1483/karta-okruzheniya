name: Auto PR

# После push рабочей ветки бот открывает PR в main (если его ещё нет) и сам
# запускает CI: PR, созданный GITHUB_TOKEN, не порождает событие pull_request,
# поэтому тесты запускаем явно через workflow_dispatch.

on:
  push:
    branches-ignore:
      - main
      - gh-pages
      - data
      - "dependabot/**"

permissions:
  contents: read
  pull-requests: write
  actions: write

concurrency:
  group: auto-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  open-pr:
    name: Open PR if missing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Create pull request and start CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          existing=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh pr create --base main --head "$BRANCH" --fill
            existing=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
            echo "Открыт PR #$existing"
          else
            echo "PR #$existing уже открыт"
          fi
          gh workflow run ci.yml --ref "$BRANCH"
