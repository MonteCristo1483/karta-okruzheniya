name: Deploy (manual)

on:
  workflow_dispatch:
    inputs:
      data_ref:
        description: "Git branch containing data.zip"
        required: true
        default: "data"

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Download data snapshot
        run: |
          git fetch origin "${{ inputs.data_ref }}" --depth=1
          mkdir -p /tmp/data
          git show "origin/${{ inputs.data_ref }}:data.zip" > /tmp/data/data.zip
          mkdir -p web/public/data
          unzip -q /tmp/data/data.zip -d web/public/data

      - name: Install
        working-directory: web
        run: npm ci

      - name: Build static export
        working-directory: web
        run: npm run build

      - name: Disable Jekyll
        run: touch web/dist/.nojekyll

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@329bcc8f12caed2cefe5a5b80781499a6f3b361b # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web/dist
          publish_branch: gh-pages
          enable_jekyll: false

