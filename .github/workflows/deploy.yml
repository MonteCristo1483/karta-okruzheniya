name: Deploy

on:
  # Автодеплой: любой merge в main публикует сайт.
  push:
    branches: [main]
  # Ручной запуск остаётся для отката данных и повторной публикации.
  workflow_dispatch:
    inputs:
      data_ref:
        description: "Git branch containing data.zip"
        required: false
        default: "data"

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Download data snapshot
        env:
          DATA_REF: ${{ inputs.data_ref || 'data' }}
        run: |
          git fetch origin "$DATA_REF" --depth=1
          mkdir -p /tmp/data
          git show "origin/$DATA_REF:data.zip" > /tmp/data/data.zip
          mkdir -p web/public/data
          unzip -q /tmp/data/data.zip -d web/public/data

      # Страховка от публикации битых данных: та же проверка, что в PR
      # по pipeline. Ненулевой exit code останавливает деплой, старый сайт
      # продолжает работать.
      - name: Validate data
        run: python3 pipeline/validate_export.py web/public/data

      - name: Install
        working-directory: web
        run: npm ci

      - name: Build static export
        working-directory: web
        run: npm run build

      - name: Disable Jekyll
        run: touch web/dist/.nojekyll

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@329bcc8f12caed2cefe5a5b80781499a6f3b361b # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web/dist
          publish_branch: gh-pages
          enable_jekyll: false
