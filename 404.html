<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Страница не найдена — Карта окружения</title>
<link rel="icon" href="/karta-okruzheniya/icon.svg">
<script>
// GitHub Pages отдаёт этот файл на любой неизвестный путь внутри сайта.
// Здесь живут старые ссылки «Поделиться» вида /r/<id>/ — страниц на дом
// больше нет, поэтому переводим их на общую страницу /r/?b=<id>.
// basePath не хардкодим в логике: на Pages сайт в /karta-okruzheniya,
// при локальной раздаче dist — в корне. В dev этот файл не используется.
(function () {
  var PROJECT_BASE = "/karta-okruzheniya";
  var path = window.location.pathname;
  var base =
    path === PROJECT_BASE || path.indexOf(PROJECT_BASE + "/") === 0
      ? PROJECT_BASE
      : "";
  var match = /\/r\/(\d{1,15})\/?$/.exec(path);
  window.location.replace(
    match ? base + "/r/?b=" + match[1] : base + "/",
  );
})();
</script>
</head>
<body style="margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:linear-gradient(180deg,#f7f2e8 0%,#e9eff5 55%,#d9e6f0 100%);color:#1f2937">
<main style="padding:0 24px;text-align:center">
  <h1 style="font-size:18px;margin:0 0 8px">Страница не найдена</h1>
  <p style="margin:0 0 16px;font-size:14px;color:#4b5563">Открываем карту…</p>
  <p style="margin:0;font-size:14px"><a href="/karta-okruzheniya/" style="color:#059669;font-weight:700">Открыть карту</a></p>
</main>
</body>
</html>
